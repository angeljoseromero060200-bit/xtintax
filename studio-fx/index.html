<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio FX - Modificador de Som</title>
<style>
:root{--primary:#00ff88;--bg:#1a1a1a;--panel:#2d2d2d;--text:#fff}
*{box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background-color:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.container{background-color:var(--panel);padding:2rem;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.5);width:90%;max-width:600px;text-align:center}
h1{margin-bottom:20px;color:var(--primary);text-transform:uppercase;letter-spacing:2px}
.file-upload{border:2px dashed #555;padding:20px;margin-bottom:20px;border-radius:8px;cursor:pointer;transition:.3s}.file-upload:hover{border-color:var(--primary);background:#333}
.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.control-group{background:#222;padding:15px;border-radius:8px;text-align:left}
label{display:block;margin-bottom:8px;font-weight:bold;font-size:.9rem}input[type=range]{width:100%;cursor:pointer;accent-color:var(--primary)}.value-display{float:right;color:var(--primary)}
.player-controls{display:flex;justify-content:center;gap:15px;margin-top:20px;flex-wrap:wrap}button{background:var(--primary);color:#000;border:none;padding:12px 30px;font-size:1rem;font-weight:bold;border-radius:50px;cursor:pointer;transition:.2s}button:hover{transform:scale(1.05);box-shadow:0 0 15px var(--primary)}button:disabled{background:#555;cursor:not-allowed;transform:none;box-shadow:none}
#status{margin-top:10px;font-size:.8rem;color:#888;word-break:break-word}@media(max-width:600px){.container{padding:1.25rem}.controls-grid{grid-template-columns:1fr}.control-group.full{grid-column:auto!important}}
</style>
</head>
<body>
<div class="container">
<h1>Studio FX</h1>
<div class="file-upload" onclick="document.getElementById('audioFile').click()"><p>📂 Clique para carregar sua música (MP3/WAV)</p><input type="file" id="audioFile" accept="audio/*" style="display:none"></div>
<div class="controls-grid">
<div class="control-group"><label>Velocidade (Pitch) <span id="val-speed" class="value-display">1.0x</span></label><input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0"></div>
<div class="control-group"><label>Volume <span id="val-vol" class="value-display">100%</span></label><input type="range" id="volume" min="0" max="1.5" step="0.01" value="1.0"></div>
<div class="control-group"><label>Graves (Bass) <span id="val-bass" class="value-display">0 dB</span></label><input type="range" id="bass" min="-20" max="20" value="0"></div>
<div class="control-group"><label>Agudos (Treble) <span id="val-treble" class="value-display">0 dB</span></label><input type="range" id="treble" min="-20" max="20" value="0"></div>
<div class="control-group full" style="grid-column:span 2"><label>Eco (Delay) <span id="val-delay" class="value-display">0s</span></label><input type="range" id="delay" min="0" max="1" step="0.05" value="0"></div>
</div>
<div class="player-controls"><button id="btnPlay" disabled>▶ Play</button><button id="btnPause" disabled>⏸ Pause</button><button id="btnStop" disabled>⏹ Stop</button></div>
<p id="status">Aguardando arquivo...</p>
</div>
<script>
let audioContext,audioSource,audioBuffer,isPlaying=false,startTime=0,pausedAt=0;const fileInput=document.getElementById('audioFile'),btnPlay=document.getElementById('btnPlay'),btnPause=document.getElementById('btnPause'),btnStop=document.getElementById('btnStop'),statusText=document.getElementById('status');const speedInput=document.getElementById('speed'),volumeInput=document.getElementById('volume'),bassInput=document.getElementById('bass'),trebleInput=document.getElementById('treble'),delayInput=document.getElementById('delay');let gainNode,bassNode,trebleNode,delayNode,feedbackNode;
function initAudio(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume()}
fileInput.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;initAudio();statusText.textContent='Carregando e processando áudio...';btnPlay.disabled=true;const reader=new FileReader();reader.onload=ev=>audioContext.decodeAudioData(ev.target.result).then(buffer=>{audioBuffer=buffer;pausedAt=0;statusText.textContent='Pronto: '+file.name;btnPlay.disabled=false;btnPause.disabled=true;btnStop.disabled=false}).catch(()=>statusText.textContent='Erro ao carregar áudio.');reader.readAsArrayBuffer(file)});
function setupEffects(){gainNode=audioContext.createGain();gainNode.gain.value=+volumeInput.value;bassNode=audioContext.createBiquadFilter();bassNode.type='lowshelf';bassNode.frequency.value=200;bassNode.gain.value=+bassInput.value;trebleNode=audioContext.createBiquadFilter();trebleNode.type='highshelf';trebleNode.frequency.value=3000;trebleNode.gain.value=+trebleInput.value;delayNode=audioContext.createDelay(1);delayNode.delayTime.value=+delayInput.value;feedbackNode=audioContext.createGain();feedbackNode.gain.value=.4}
function playAudio(){if(!audioBuffer||isPlaying)return;initAudio();if(pausedAt>=audioBuffer.duration)pausedAt=0;audioSource=audioContext.createBufferSource();audioSource.buffer=audioBuffer;audioSource.playbackRate.value=+speedInput.value;setupEffects();audioSource.connect(bassNode);bassNode.connect(trebleNode);trebleNode.connect(gainNode);gainNode.connect(audioContext.destination);if(+delayInput.value>0){gainNode.connect(delayNode);delayNode.connect(feedbackNode);feedbackNode.connect(delayNode);delayNode.connect(audioContext.destination)}audioSource.onended=()=>{if(isPlaying){isPlaying=false;pausedAt=0;btnPlay.disabled=false;btnPause.disabled=true;statusText.textContent='Finalizado.'}};audioSource.start(0,pausedAt);startTime=audioContext.currentTime-pausedAt;isPlaying=true;btnPlay.disabled=true;btnPause.disabled=false;statusText.textContent='Tocando...'}
function pauseAudio(){if(!isPlaying)return;const elapsed=audioContext.currentTime-startTime;try{audioSource.stop()}catch(e){}pausedAt=Math.min(elapsed,audioBuffer.duration);isPlaying=false;btnPlay.disabled=false;btnPause.disabled=true;statusText.textContent='Pausado.'}
function stopAudio(){if(audioSource)try{audioSource.stop()}catch(e){}isPlaying=false;pausedAt=0;btnPlay.disabled=!audioBuffer;btnPause.disabled=true;statusText.textContent='Parado.'}
speedInput.oninput=e=>{document.getElementById('val-speed').textContent=e.target.value+'x';if(audioSource)audioSource.playbackRate.value=+e.target.value};volumeInput.oninput=e=>{document.getElementById('val-vol').textContent=Math.round(+e.target.value*100)+'%';if(gainNode)gainNode.gain.value=+e.target.value};bassInput.oninput=e=>{document.getElementById('val-bass').textContent=e.target.value+' dB';if(bassNode)bassNode.gain.value=+e.target.value};trebleInput.oninput=e=>{document.getElementById('val-treble').textContent=e.target.value+' dB';if(trebleNode)trebleNode.gain.value=+e.target.value};delayInput.oninput=e=>{document.getElementById('val-delay').textContent=e.target.value+'s';if(delayNode)delayNode.delayTime.value=+e.target.value};btnPlay.onclick=playAudio;btnPause.onclick=pauseAudio;btnStop.onclick=stopAudio;
</script>
</body></html>
